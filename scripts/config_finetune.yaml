# config_finetune.yaml
# Configuration for: python finetune.py

# ---------------------------------------------------------------------------
# Model — lightly_train pretrained model to finetune
# ---------------------------------------------------------------------------
checkpoint:
  # Passed as `model=` to train_semantic_segmentation.
  # Downloaded automatically to cache_dir if not already present.
  base_model: "dinov3/vits16-eomt-cityscapes"

# ---------------------------------------------------------------------------
# Cache directories for model weights and lightly_train internals
# ---------------------------------------------------------------------------
cache:
  lightly_train_cache_dir:       "/lightly_cache"
  lightly_train_model_cache_dir: "/lightly_cache"
  torch_home:                    "/lightly_cache"

# ---------------------------------------------------------------------------
# Tiled data source
# ---------------------------------------------------------------------------
tiled:
  images_uri: "http://tiled:8000/api/v1/metadata/recons/42tiff"
  masks_uri:  "http://tiled:8000/api/v1/metadata/recons/42tiff_7classes_masks_tiff"  # converted tiff
  api_key:    null   # overridden by env TILED_API_KEY
  val_split:  0.2    # 20% val, 80% train

# ---------------------------------------------------------------------------
# Dataset / classes
# ---------------------------------------------------------------------------
dataset:
  classes:
    0:   "background"
    1:   "cortex"
    2:   "Phloem Fibers"
    3:   "Phloem"
    4:   "Hydrated Xylem vessels"
    5:   "Air-based Pith cells"
    6:   "Water-based Pith cells"
    7:   "Dehydrated Xylem vessels"
    255: "unknown"
  ignore_classes: [255]

# ---------------------------------------------------------------------------
# Finetuning hyper-parameters
# ---------------------------------------------------------------------------
finetune:
  steps:      100
  batch_size: 1           # global batch size; per-GPU = batch_size / num_gpus
  num_nodes:  1           # overridden by SLURM_NNODES at runtime
  devices:    "auto"      # uses all visible GPUs per node
  # Final out_dir resolved at runtime as: out_dir / base_model
  out_dir:    "/lightly_out_finetuned"
  log_every_num_steps:     10
  val_every_num_steps:     20
  val_log_every_num_steps: 10
  save_every_num_steps:    10
  save_last: true
  save_best:  true
  overwrite:  true   # set false and resume_interrupted: true to resume a crashed run
  resume_interrupted: false

# ---------------------------------------------------------------------------
# MLflow — registers the finetuned model at the end of training
# ---------------------------------------------------------------------------
mlflow:
  tracking_uri:         "http://localhost:5000"  # overridden by env MLFLOW_TRACKING_URI_OUTSIDE
  experiment_name:      "petiole_segmentation"
  finetuned_model_name: "petiole_vits16_eomt_cityscapes_ft"

# ---------------------------------------------------------------------------
# Pip requirements stored inside the finetuned MLflow model artifact
# ---------------------------------------------------------------------------
pip_requirements:
  - "lightly-train==0.13.2"
  - "numpy==2.2.6"
  - "torch==2.9.1"
  - "torchvision==0.24.1"
  - "pytorch-lightning==2.6.0"
  - "Pillow"
  - "mlflow==2.22.0"